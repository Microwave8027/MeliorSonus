[package]
name = "compose-app"
version = "0.1.0"
edition = "2024"

[dependencies]
uniffi = { version = "0.29.4", features = ["cli"] }
cpal = "0.18.1"
# log = "0.4"
# android_logger = "0.13"
hound = "3.5"
rtrb = "0.3"
realfft = "3.4"
biquad = "0.4"
rubato = "0.16"
pitch-detection = "0.3"
arrayvec = "0.7"
tract-onnx = "0.23"
dtw_rs = "0.10.0"
musicxml = "1.1.2"
rkyv = { version = "0.8", features = ["alloc"] }
memmap2 = "0.9" 

[build-dependencies]
bindgen = "0.72.1"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/commonMain/rust/lib.rs"

[[example]]
name = "mic_listener"
path = "scripts/rust_examples/mic_listener.rs"

[[example]]
name = "audio_visualizer"
crate-type = ["cdylib"]
path = "scripts/rust_examples/audio_visualizer/noise_visualizer.rs"

[dev-dependencies]
eframe = "0.36"
egui_plot = "0.37"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
uniffi = "0.29.4"
