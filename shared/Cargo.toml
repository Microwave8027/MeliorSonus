[package]
name = "compose-app"
version = "0.1.0"
edition = "2024"

[dependencies]
uniffi = "0.29.4"
cpal = "0.18.1"
# log = "0.4"
# android_logger = "0.13"
hound = "3.5"
rtrb = "0.3"
realfft = "3.4"
biquad = "0.4"
rubato = "0.16"
pitch-detection = "0.3"
arrayvec = "0.7"
tract-onnx = "0.21"
dtw_rs = "0.10.0"
musicxml = "1.1.2"
symphonia = "0.6.1"
core_affinity = "0.8.3"
midly = "0.5.3"
rkyv = { version = "0.8", features = ["alloc"] }
memmap2 = "0.9" 

[build-dependencies]
bindgen = "0.72.1"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/commonMain/rust/lib.rs"

[[example]]
name = "mic_listener"
path = "rust_examples/mic_listener.rs"
